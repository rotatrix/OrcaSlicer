name: Build all

on:
  workflow_dispatch: # allows for manual dispatch
    inputs:
      candidate-sha:
        description: Approved full commit SHA (must match the selected workflow ref)
        type: string
        required: true
      platform:
        description: Platform family (all for complete validation)
        type: choice
        default: all
        options: [all, windows, linux, macos, flatpak]
      build-deps-only:
        description: 'Only build dependencies (bypasses caching)'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.platform || 'all' }}
  cancel-in-progress: false


jobs:
  candidate:
    name: Verify candidate
    runs-on: ubuntu-24.04
    steps:
      - name: Require the approved exact source
        env:
          CANDIDATE_SHA: ${{ inputs.candidate-sha }}
        run: |
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ && "$CANDIDATE_SHA" == "$GITHUB_SHA" ]]
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Release selection regression tests
        run: python -m unittest discover -s .github/scripts/tests -v
  build_linux:
    needs: candidate
    if: inputs.platform == 'all' || inputs.platform == 'linux'
    uses: ./.github/workflows/build_check_cache.yml
    with:
      os: ubuntu-24.04
      build-deps-only: ${{ inputs.build-deps-only }}
    secrets: inherit
  build_windows:
    name: Build Windows x64
    needs: candidate
    if: inputs.platform == 'all' || inputs.platform == 'windows'
    uses: ./.github/workflows/build_check_cache.yml
    with:
      os: windows-2022
      arch: x64
      build-deps-only: ${{ inputs.build-deps-only }}
    secrets: inherit
  build_macos_arch:
    needs: candidate
    strategy:
      fail-fast: false
      matrix:
        arch:
          - arm64
          - x86_64
    if: ${{ needs.candidate.result == 'success' && (inputs.platform == 'all' || inputs.platform == 'macos') && !cancelled() }}
    uses: ./.github/workflows/build_check_cache.yml
    with:
      os: macos-14
      arch: ${{ matrix.arch }}
      build-deps-only: ${{ inputs.build-deps-only || false }}
    secrets: inherit
  build_macos_universal:
    name: Build macOS Universal
    needs: build_macos_arch
    if: ${{ !cancelled() && needs.build_macos_arch.result == 'success' && !inputs.build-deps-only }}
    uses: ./.github/workflows/build_orca.yml
    with:
      os: macos-14
      arch: universal
      macos-combine-only: true
    secrets: inherit
  unit_tests:
    name: Unit Tests
    runs-on: ubuntu-24.04
    needs: build_linux
    if: ${{ !cancelled() && success() && !inputs.build-deps-only }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            .github
            scripts
            tests
            build_linux.sh
      - name: Apt-Install Dependencies
        if: ${{ !vars.SELF_HOSTED }}
        uses: ./.github/actions/apt-install-deps
      - name: Restore Test Artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ github.sha }}-tests
      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~4.3.0"  # use most recent 4.3.x version
          useLocalCache: true         # <--= Use the local cache (default is 'false').
          useCloudCache: true
      - name: Unpackage and Run Unit Tests
        timeout-minutes: 20
        run: |
          tar -xvf build_tests.tar
          scripts/run_unit_tests.sh
      - name: Upload Test Logs
        uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          retention-days: 14
          overwrite: true
          name: unit-test-logs-${{ github.sha }}
          path: build/tests/**/*.log
      - name: Publish Test Results
        if: always() && github.event_name != 'pull_request'
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: "ctest_results.xml"
          check_run: false
          comment_mode: off
  flatpak:
    needs: candidate
    name: "Flatpak"
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
      volumes:
        - /usr/local/lib/android:/usr/local/lib/android
        - /usr/share/dotnet:/usr/share/dotnet
        - /opt/ghc:/opt/ghc1
        - /usr/local/share/boost:/usr/local/share/boost1
        - /opt/hostedtoolcache:/opt/hostedtoolcache1
    if: ${{ needs.candidate.result == 'success' && (inputs.platform == 'all' || inputs.platform == 'flatpak') && !cancelled() && !inputs.build-deps-only }}

    runs-on: ubuntu-24.04
    env:
      date:
      ver:
      ver_pure:
    steps:
    - name: "Remove unneeded stuff to free disk space"
      run:
        rm -rf /usr/local/lib/android/* /usr/share/dotnet/* /opt/ghc1/* "/usr/local/share/boost1/*" /opt/hostedtoolcache1/*
    - uses: actions/checkout@v6
      with:
        ref: ${{ github.sha }}
    - name: Prepare OpenAxis
      run: python3 .github/scripts/rotatrix-ci.py prepare
    - name: Get the version and date
      run: |
        ver_pure=$(grep 'set(SoftFever_VERSION' version.inc | cut -d '"' -f2)
        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          ver="PR-${{ github.event.number }}"
          git_commit_hash="${{ github.event.pull_request.head.sha }}"
        else
          ver=V$ver_pure
          git_commit_hash="${{ github.sha }}"
        fi
        echo "ver=$ver" >> $GITHUB_ENV
        echo "ver_pure=$ver_pure" >> $GITHUB_ENV
        echo "date=$(date +'%Y%m%d')" >> $GITHUB_ENV
        echo "git_commit_hash=$git_commit_hash" >> $GITHUB_ENV
      shell: bash
    # Manage flatpak-builder cache externally so PRs restore but never upload
    - name: Restore flatpak-builder cache
      if: github.event_name == 'pull_request'
      uses: actions/cache/restore@v5
      with:
        path: .flatpak-builder
        key: flatpak-builder-x86_64-${{ github.event.pull_request.base.sha }}
        restore-keys: flatpak-builder-x86_64-
    - name: Restore flatpak-builder cache for branch builds
      id: flatpak_cache
      if: github.event_name != 'pull_request'
      uses: actions/cache/restore@v5
      with:
        path: .flatpak-builder
        key: flatpak-builder-x86_64-${{ github.sha }}
        restore-keys: flatpak-builder-x86_64-
    - name: Disable debug info for faster CI builds
      run: |
        sed -i '/^build-options:/a\  no-debuginfo: true\n  strip: true' \
          scripts/flatpak/com.orcaslicer.OrcaSlicer.yml
      shell: bash
    - name: Inject git commit hash into Flatpak manifest
      run: |
        sed -i "/name: OrcaSlicer/{n;s|buildsystem: simple|buildsystem: simple\n    build-options:\n      env:\n        git_commit_hash: \"$git_commit_hash\"|}" \
          scripts/flatpak/com.orcaslicer.OrcaSlicer.yml
      shell: bash
    - uses: flatpak/flatpak-github-actions/flatpak-builder@master
      with:
        bundle: OrcaSlicer-Linux-flatpak_${{ env.ver }}_x86_64.flatpak
        manifest-path: scripts/flatpak/com.orcaslicer.OrcaSlicer.yml
        cache: false
        arch: x86_64
        upload-artifact: false
    - name: Save successful Flatpak build cache
      if: github.event_name != 'pull_request' && steps.flatpak_cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: .flatpak-builder
        key: flatpak-builder-x86_64-${{ github.sha }}
    - name: Stage Flatpak download
      run: python3 .github/scripts/rotatrix-ci.py stage flatpak 'x86_64'
    - name: Upload artifacts Flatpak
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        retention-days: 14
        archive: false
        if-no-files-found: error
        path: artifacts/OrcaSlicer-linux-x64-${{ github.sha }}.flatpak
