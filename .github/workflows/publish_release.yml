name: Publish Rotatrix release draft

on:
  workflow_call:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Consume only the upstream distribution artifacts from this exact run.
      - uses: actions/download-artifact@v8
        with:
          pattern: Rotatrix-*-${{ github.sha }}
          path: release-assets
          merge-multiple: true
      - name: Validate and assemble release draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python .github/scripts/openaxis-release.py release-assets
