on:
    workflow_call:
      inputs:
        cache-key:
          required: false
          type: string
        cache-path:
          required: false
          type: string
        os:
          required: true
          type: string
        arch:
          required: false
          type: string
        macos-combine-only:
          required: false
          type: boolean
          default: false

jobs:
  build_orca:
    name: Build OrcaSlicer
    runs-on: ${{ inputs.os }}
    env:
      date:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      ver:
      ver_pure:
      ubuntu-ver: '2404'
      ubuntu-ver-str: '_Ubuntu2404'

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          lfs: 'false'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare OpenAxis
        run: python .github/scripts/rotatrix-ci.py prepare
      - name: Configure macOS SDK
        if: runner.os == 'macOS'
        run: |
          echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"
          echo "$(brew --prefix)/opt/gettext/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix)/opt/texinfo/bin" >> "$GITHUB_PATH"
      - name: Enable Intel macOS smoke checks
        if: runner.os == 'macOS' && inputs.arch == 'x86_64'
        run: |
          if [ "$(uname -m)" = arm64 ]; then sudo softwareupdate --install-rosetta --agree-to-license; fi
      - name: load cached deps
        if: ${{ !(runner.os == 'macOS' && inputs.macos-combine-only) }}
        uses: actions/cache@v5
        with:
          path: ${{ inputs.cache-path }}
          key: ${{ inputs.cache-key }}
          fail-on-cache-miss: true

      - uses: lukka/get-cmake@latest
        # The windows-11-arm runner needs CMake <= 3.31 (handled in the next step).
        if: ${{ !(runner.os == 'Windows' && inputs.arch == 'arm64') }}
        with:
          cmakeVersion: "~4.3.0"  # use most recent 4.3.x version
          useLocalCache: true         # <--= Use the local cache (default is 'false').
          useCloudCache: true

      - name: Install CMake 3.31.x (Windows ARM64)
        # windows-11-arm ships CMake 4.x, which removed pre-3.5 policy
        # compatibility AND has incomplete ASM_ARMASM linker modules
        # (breaks Boost.Context on ARM64). Pin to the last 3.x release.
        if: runner.os == 'Windows' && inputs.arch == 'arm64'
        shell: pwsh
        run: |
          $ver = "3.31.6"
          $url = "https://github.com/Kitware/CMake/releases/download/v$ver/cmake-$ver-windows-arm64.zip"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\cmake.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\cmake.zip" -DestinationPath "$env:RUNNER_TEMP\cmake" -Force
          $cmakeBin = "$env:RUNNER_TEMP\cmake\cmake-$ver-windows-arm64\bin"
          if (-not (Test-Path "$cmakeBin\cmake.exe")) { throw "cmake.exe not found at $cmakeBin" }
          Add-Content -Path $env:GITHUB_PATH -Value $cmakeBin

      - name: Get the version and date on Ubuntu and macOS
        if: runner.os != 'Windows'
        run: |
          ver_pure=$(grep 'set(SoftFever_VERSION' version.inc | cut -d '"' -f2)
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            ver="PR-${{ github.event.number }}"
            git_commit_hash="${{ github.event.pull_request.head.sha }}"
          else
            ver=V$ver_pure
            git_commit_hash=""
          fi
          echo "ver=$ver" >> $GITHUB_ENV
          echo "ver_pure=$ver_pure" >> $GITHUB_ENV
          echo "date=$(date +'%Y%m%d')" >> $GITHUB_ENV
          echo "git_commit_hash=$git_commit_hash" >> $GITHUB_ENV
          # Per-arch Linux AppImage naming: amd64 keeps the historical unsuffixed
          # name (arch_suffix empty). Unused on macOS/Windows.
          if [ '${{ inputs.arch }}' = 'aarch64' ]; then
            echo "arch_suffix=_aarch64" >> $GITHUB_ENV
          fi
        shell: bash

      - name: Get the version and date on Windows
        if: runner.os == 'Windows'
        run: |
          $date = Get-Date -Format 'yyyyMMdd'
          $ref = "${{ github.ref }}"
          $eventName = "${{ github.event_name }}"
          $prNumber = "${{ github.event.number }}"

          if ($eventName -eq 'pull_request') {
              $ver = "PR" + $prNumber
              $git_commit_hash = "${{ github.event.pull_request.head.sha }}"
          } else {
              $versionContent = Get-Content version.inc -Raw
              if ($versionContent -match 'set\(SoftFever_VERSION "(.*?)"\)') {
                  $ver = $matches[1]
              }
              $ver = "V$ver"
              $git_commit_hash = ""
          }

          echo "ver=$ver" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
          echo "date=$date" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
          echo "git_commit_hash=$git_commit_hash" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
          echo "date: ${{ env.date }} version: ${{ env.ver }}"
        shell: pwsh

#   Mac
      - name: Install tools mac
        if: runner.os == 'macOS' && !inputs.macos-combine-only
        run: |
          if [ -z "${{ vars.SELF_HOSTED }}" ]; then
            brew install libtool gettext
            brew list
          fi
          mkdir -p ${{ github.workspace }}/deps/build/${{ inputs.arch }}

      - name: Build slicer mac
        if: runner.os == 'macOS' && !inputs.macos-combine-only
        working-directory: ${{ github.workspace }}
        run: |
          ./build_release_macos.sh -s -n -x ${{ !vars.SELF_HOSTED && '-1' || '' }} -a ${{ inputs.arch }} -t 10.15

      - name: Verify OpenAxis macOS build
        if: runner.os == 'macOS' && !inputs.macos-combine-only
        run: python .github/scripts/rotatrix-ci.py verify macos '${{ inputs.arch }}'
      - name: Package and smoke-test macOS apps
        if: runner.os == 'macOS' && !inputs.macos-combine-only
        run: |
          python -m unittest discover -s .github/scripts/tests -v
          python .github/scripts/package-macos.py '${{ inputs.arch }}' '${{ github.sha }}'

      - name: Upload macOS app
        if: runner.os == 'macOS' && !inputs.macos-combine-only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          retention-days: 14
          archive: false
          path: macos-app-${{ inputs.arch }}-${{ github.sha }}.tar.gz
          if-no-files-found: error

      - name: Upload macOS profile validator
        if: runner.os == 'macOS' && !inputs.macos-combine-only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          retention-days: 14
          archive: false
          path: macos-app-profile-validator-${{ inputs.arch }}-${{ github.sha }}.tar.gz

      - name: Download macOS app bundles
        if: runner.os == 'macOS' && inputs.macos-combine-only
        uses: actions/download-artifact@v8
        with:
          pattern: macos-app-*-${{ github.sha }}.tar.gz
          merge-multiple: true
          path: ${{ github.workspace }}/mac_bundles

      - name: Extract macOS app bundles
        if: runner.os == 'macOS' && inputs.macos-combine-only
        working-directory: ${{ github.workspace }}
        run: |
          for arch in arm64 x86_64; do
            mkdir -p "build/$arch/OrcaSlicer"
            tar -xzf "mac_bundles/macos-app-$arch-${{ github.sha }}.tar.gz" -C "build/$arch/OrcaSlicer"
            validator="mac_bundles/macos-app-profile-validator-$arch-${{ github.sha }}.tar.gz"
            if [ -f "$validator" ]; then
              tar -xzf "$validator" -C "build/$arch/OrcaSlicer"
            fi
          done

      - name: Build universal mac app bundle
        if: runner.os == 'macOS' && inputs.macos-combine-only
        working-directory: ${{ github.workspace }}
        run: |
          ./build_release_macos.sh -u -x ${{ !vars.SELF_HOSTED && '-1' || '' }} -a universal -t 10.15

      - name: Package and smoke-test universal macOS apps
        if: runner.os == 'macOS' && inputs.macos-combine-only
        run: python .github/scripts/package-macos.py universal '${{ github.sha }}'

      - name: Upload universal macOS app
        if: runner.os == 'macOS' && inputs.macos-combine-only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          retention-days: 14
          archive: false
          path: macos-app-universal-${{ github.sha }}.tar.gz
          if-no-files-found: error

      - name: Upload universal macOS profile validator
        if: runner.os == 'macOS' && inputs.macos-combine-only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          retention-days: 14
          archive: false
          path: macos-app-profile-validator-universal-${{ github.sha }}.tar.gz

# Windows
      - name: Set Windows build variables
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ("${{ inputs.arch }}" -eq "arm64") {
            "BUILD_DIR=build-arm64"  | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
            "ARCH_SUFFIX=_arm64"     | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
          } else {
            "BUILD_DIR=build"        | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
            "ARCH_SUFFIX=_x64"       | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
          }

      - name: Windows compiler environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ inputs.arch }}
      - name: setup MSVC
        if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@v3

      - name: Install nsis
        if: runner.os == 'Windows' && !vars.SELF_HOSTED
        run: |
          dir "C:/Program Files (x86)/Windows Kits/10/Include"
          choco install nsis

      - name: Build slicer Win
        if: runner.os == 'Windows'
        working-directory: ${{ github.workspace }}
        # Orca: Removed Netfabb STL fixing service support in favor of CGAL.
        # env:
        #   WindowsSdkDir: 'C:\Program Files (x86)\Windows Kits\10\'
        #   WindowsSDKVersion: '10.0.26100.0\'
        run: |
          $arch = "${{ inputs.arch }}"
          if ($arch -eq "arm64") { .\build_release_vs.bat slicer arm64 -x } else { .\build_release_vs.bat slicer }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        shell: pwsh

      - name: Verify OpenAxis Windows build
        if: runner.os == 'Windows'
        run: python .github/scripts/rotatrix-ci.py verify windows '${{ inputs.arch }}'

      # NSIS is x86-only; it runs (and the installer it emits runs) under ARM64's
      # x86 emulation, packaging the native arm64 payload from build-arm64.
      - name: Create installer Win
        if: runner.os == 'Windows' && !vars.SELF_HOSTED
        working-directory: ${{ github.workspace }}/${{ env.BUILD_DIR }}
        run: |
          cpack -G NSIS

      - name: Pack app
        if: runner.os == 'Windows'
        working-directory: ${{ github.workspace }}/${{ env.BUILD_DIR }}
        shell: cmd
        run: '"C:/Program Files/7-Zip/7z.exe" a -tzip OrcaSlicer_Windows_${{ env.ver }}${{ env.ARCH_SUFFIX }}_portable.zip ${{ github.workspace }}/${{ env.BUILD_DIR }}/OrcaSlicer'

      - name: Pack PDB
        if: runner.os == 'Windows' && inputs.arch != 'arm64' && !vars.SELF_HOSTED
        working-directory: ${{ github.workspace }}/${{ env.BUILD_DIR }}/src/Release
        shell: cmd
        run: '"C:/Program Files/7-Zip/7z.exe" a -m0=lzma2 -mx9 Debug_PDB_${{ env.ver }}_for_developers_only.7z  *.pdb'

      - name: Stage Windows downloads
        if: runner.os == 'Windows'
        run: python .github/scripts/rotatrix-ci.py stage windows '${{ inputs.arch }}'
      - name: Upload artifacts Win zip
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          retention-days: 14
          archive: false
          if-no-files-found: error
          path: artifacts/OrcaSlicer-windows-x64-${{ github.sha }}.zip

      - name: Upload artifacts Win installer
        if: runner.os == 'Windows' && !vars.SELF_HOSTED
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          retention-days: 14
          archive: false
          if-no-files-found: error
          path: artifacts/OrcaSlicer-windows-x64-${{ github.sha }}.exe

      - name: Upload artifacts Win PDB
        if: runner.os == 'Windows' && inputs.arch != 'arm64' && !vars.SELF_HOSTED
        uses: actions/upload-artifact@v7
        with:
          retention-days: 14
          overwrite: true
          name: PDB-${{ github.sha }}
          path: ${{ github.workspace }}/build/src/Release/Debug_PDB_${{ env.ver }}_for_developers_only.7z

      - name: Upload OrcaSlicer_profile_validator Win
        if: runner.os == 'Windows' && inputs.arch != 'arm64' && !vars.SELF_HOSTED
        uses: actions/upload-artifact@v7
        with:
          retention-days: 14
          overwrite: true
          name: OrcaSlicer_profile_validator_Windows_${{ env.ver }}-${{ github.sha }}
          path: ${{ github.workspace }}/build/src/Release/OrcaSlicer_profile_validator.exe

      - name: Build MSIX Store package Win
        if: github.repository == 'OrcaSlicer/OrcaSlicer' && runner.os == 'Windows' && !vars.SELF_HOSTED
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: |
          ./scripts/msix/build_msix.ps1 `
            -InstallDir "${{ github.workspace }}/${{ env.BUILD_DIR }}/OrcaSlicer" `
            -OutputPath "${{ github.workspace }}/${{ env.BUILD_DIR }}/OrcaSlicer_Windows_MSIX_${{ env.ver }}${{ env.ARCH_SUFFIX }}.msix" `
            -Architecture "${{ inputs.arch }}" `
            -IdentityName "${{ vars.ORCA_MSIX_IDENTITY_NAME || 'OrcaSlicer.OrcaSlicer' }}" `
            -Publisher "${{ vars.ORCA_MSIX_PUBLISHER || 'CN=38F7EA55-C73B-4072-B3B2-C8E0EA15BB82' }}" `
            -PublisherDisplayName "${{ vars.ORCA_MSIX_PUBLISHER_DISPLAY_NAME || 'OrcaSlicer' }}"

      - name: Upload artifacts Win MSIX
        if: github.repository == 'OrcaSlicer/OrcaSlicer' && runner.os == 'Windows' && !vars.SELF_HOSTED
        uses: actions/upload-artifact@v7
        with:
          retention-days: 14
          overwrite: true
          name: OrcaSlicer_Windows_MSIX_${{ env.ver }}${{ env.ARCH_SUFFIX }}-${{ github.sha }}
          path: ${{ github.workspace }}/${{ env.BUILD_DIR }}/OrcaSlicer_Windows_MSIX_${{ env.ver }}${{ env.ARCH_SUFFIX }}.msix

# Ubuntu
      - name: Apt-Install Dependencies
        if: runner.os == 'Linux' && !vars.SELF_HOSTED
        uses: ./.github/actions/apt-install-deps

        # Tests must built at the same time as the slicer;
        # if you untangle them feel free to separate them here too
      - name: Install smoke-test display
        if: runner.os == 'Linux'
        run: sudo apt-get install -y xvfb
      - name: Build slicer and tests
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Build the upstream unit tests on the supported Linux x64 leg.
          tests=true
          if $tests; then flags=-istrlL; else flags=-isrlL; fi
          ./build_linux.sh "$flags"
          ./scripts/check_appimage_libs.sh ./build/package ./build/package/bin/orca-slicer
          appimage=./build/OrcaSlicer_Linux_AppImage${{ env.ubuntu-ver-str }}${{ env.arch_suffix }}_${{ env.ver }}.AppImage
          mv -n ./build/OrcaSlicer_Linux_V${{ env.ver_pure }}.AppImage "$appimage"
          chmod +x "$appimage"
          if $tests; then tar -cvpf build_tests.tar build/tests; fi

        # Use tar because upload-artifacts won't always preserve directory structure
        # and doesn't preserve file permissions
      - name: Upload Test Artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.sha }}-tests
          overwrite: true
          path: build_tests.tar
          retention-days: 5
          if-no-files-found: error

      - name: Run external slicer regression tests
        if: runner.os == 'Linux' && inputs.arch != 'aarch64'
        timeout-minutes: 20
        shell: bash
        run: |
          test_repo_dir="${{ runner.temp }}/orca-test-repo"
          rm -rf "$test_repo_dir"
          # Freeze the suite at the last revision before upstream v2.4.2.
          # Current test-repo HEAD exercises 2.5-dev CLI flags and behavior.
          git init "$test_repo_dir"
          git -C "$test_repo_dir" remote add origin https://github.com/OrcaSlicer/orca-test-repo.git
          git -C "$test_repo_dir" fetch --depth 1 origin 0dfd8df467895d7093d50b267c7209fd53f43a40
          git -C "$test_repo_dir" checkout --detach FETCH_HEAD
          python3 "$test_repo_dir/run_test.py" "${{ github.workspace }}/build/package/bin/orca-slicer"

      - name: Build orca_custom_preset_tests
        if: github.ref == 'refs/heads/main' && runner.os == 'Linux' && !vars.SELF_HOSTED && inputs.arch != 'aarch64'
        working-directory: ${{ github.workspace }}/build/src/Release
        shell: bash
        run: |
          ./OrcaSlicer_profile_validator -p ${{ github.workspace }}/resources/profiles -g 1
          cd ${{ github.workspace }}/resources/profiles
          zip -r orca_custom_preset_tests.zip user/

      - name: Verify OpenAxis Linux build
        if: runner.os == 'Linux'
        run: python .github/scripts/rotatrix-ci.py verify linux '${{ inputs.arch || 'x64' }}'
      - name: Stage Linux downloads
        if: runner.os == 'Linux'
        run: python .github/scripts/rotatrix-ci.py stage linux '${{ inputs.arch || 'x64' }}'
      - name: Upload artifacts Ubuntu
        if: ${{ ! env.ACT && runner.os == 'Linux' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          retention-days: 14
          archive: false
          if-no-files-found: error
          path: artifacts/OrcaSlicer-linux-x64-${{ github.sha }}.AppImage

      - name: Upload OrcaSlicer_profile_validator Ubuntu
        if: ${{ ! env.ACT && runner.os == 'Linux' && !vars.SELF_HOSTED && inputs.arch != 'aarch64' }}
        uses: actions/upload-artifact@v7
        with:
          retention-days: 14
          overwrite: true
          name: OrcaSlicer_profile_validator_Linux_ubuntu_${{ env.ubuntu-ver }}_${{ env.ver }}-${{ github.sha }}
          path: './build/src/Release/OrcaSlicer_profile_validator'

      - name: Upload build diagnostics
        if: failure()
        timeout-minutes: 3
        uses: actions/upload-artifact@v7
        with:
          overwrite: true
          name: logs-${{ runner.os }}-${{ inputs.arch }}-${{ github.sha }}
          path: |
            build/CMakeCache.txt
            build-arm64/CMakeCache.txt
            build/arm64/CMakeCache.txt
            build/x86_64/CMakeCache.txt
            build/CMakeFiles/CMakeConfigureLog.yaml
            build-arm64/CMakeFiles/CMakeConfigureLog.yaml
            build/arm64/CMakeFiles/CMakeConfigureLog.yaml
            build/x86_64/CMakeFiles/CMakeConfigureLog.yaml
          retention-days: 14

      - name: Attest macOS packages
        if: runner.os == 'macOS' && github.repository == 'rotatrix/OrcaSlicer' && startsWith(github.ref, 'refs/heads/rotatrix/')
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: macos-app-*.tar.gz
